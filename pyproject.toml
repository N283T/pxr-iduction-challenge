[project]
authors = [{name = "N283T", email = "w255508b@yokohama-cu.ac.jp"}]
dependencies = ["tabpfn>=7.1.0,<8", "gradio-client>=2.4.0,<3"]
name = "pxr-iduction-challenge"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "13.1"

[tool.pixi.pypi-dependencies]
deepchem = ">=2.8, <3"

[tool.pixi.tasks]
db-start = "pg_ctl -D db/pgdata -l db/pgdata/logfile -o '-k /tmp -p 5433' start"
db-stop = "pg_ctl -D db/pgdata stop"
db-status = "pg_ctl -D db/pgdata status"
db-psql = "psql -h /tmp -p 5433 -d pxr_challenge"
# jazzy has a hard rdkit<2024 pin but only uses stable RDKit APIs, so we
# install it with --no-deps against our modern rdkit. kallisto is a required
# transitive dep that also has no strict deps we care about.
install-jazzy = "pip install --no-deps jazzy==0.1.4 kallisto==1.0.10"

[tool.pixi.dependencies]
python = "3.12.*"
postgresql = ">=18.3,<19"
rdkit = ">=2026.3.1,<2027"
rdkit-postgresql = ">=2026.3.1,<2027"
pandas = ">=3.0.2,<4"
pyarrow = ">=23.0.1,<24"
plotly = ">=6.6.0,<7"
marimo = ">=0.21.1,<0.22"
tabulate = ">=0.10.0,<0.11"
psycopg2 = ">=2.9.11,<3"
lightgbm = ">=4.6.0,<5"
scikit-learn = ">=1.8.0,<2"
chembl_structure_pipeline = ">=1.2.4,<2"
mordredcommunity = ">=2.0.7,<3"
pytorch-gpu = ">=2.10.0,<3"
chemprop = ">=2.2.3,<3"
lightning = ">=2.6.1,<3"
transformers = ">=5.5.0,<6"
sqlalchemy = ">=2.0.49,<3"
pip = ">=26.0.1,<27"
optuna = ">=4.8.0,<5"
umap-learn = ">=0.5.11,<0.6"
catboost = ">=1.2.10,<2"
xgboost = ">=3.2.0,<4"
